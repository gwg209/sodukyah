<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOKYAH - Integrated Notes</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --header-bg: #222222;
            --cell-size: min(50px, 10vw);
            --border-thick: 2px solid #000;
            --border-thin: 1px solid #ccc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header & Menu Styles */
        .header {
            background: var(--header-bg);
            color: white;
            width: calc(var(--cell-size) * 9 + 4px);
            padding: 10px 0;
            text-align: center;
            font-weight: bold;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px 4px 0 0;
        }

        .menu-container { position: absolute; right: 10px; cursor: pointer; z-index: 2000; }
        .menu-content {
            display: none; position: absolute; right: 0; top: 100%;
            background: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 4px; text-align: left;
        }
        .menu-content.show { display: block; }
        .menu-item { color: #333; padding: 10px 15px; font-size: 14px; border-bottom: 1px solid #eee; cursor: pointer; }
        .menu-group-label { background: #eee; padding: 5px 15px; font-size: 11px; color: #666; text-transform: uppercase; }

        /* Grid Styles */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, var(--cell-size));
            grid-template-rows: repeat(9, var(--cell-size));
            border: var(--border-thick);
            background-color: white;
        }

        .cell-container {
            position: relative;
            width: var(--cell-size);
            height: var(--cell-size);
            box-sizing: border-box;
            border: var(--border-thin);
        }

        /* 3x3 Grid Borders */
        .cell-container:nth-child(3n) { border-right: var(--border-thick); }
        .cell-container:nth-child(9n) { border-right: var(--border-thick); }
        .cell-container:nth-child(n+19):nth-child(-n+27),
        .cell-container:nth-child(n+46):nth-child(-n+54) { border-bottom: var(--border-thick); }

        /* The main input number */
        .cell-input {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 1.5rem;
            color: #1155cc;
            z-index: 2;
            outline: none;
        }

        .cell-input:focus { background: rgba(33, 150, 243, 0.1); }
        .hint-cell .cell-input { font-weight: bold; color: black; background: #eee; }

        /* The Pencil Marks (Notes) */
        .notes-grid-mini {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass to input */
            padding: 2px;
            box-sizing: border-box;
        }

        .note-digit {
            font-size: 9px;
            color: #888;
            text-align: center;
            line-height: 1;
            visibility: hidden;
        }
        .note-digit.visible { visibility: visible; }

        /* Logic classes */
        .error .cell-input { background-color: #ff9999; }
        .correct .cell-input { background-color: #99ff99; }

        #toast {
            position: fixed; bottom: 20px; background: #333; color: #fff;
            padding: 10px 20px; border-radius: 5px; display: none;
        }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

<div class="header">
    SUDOKYAH v16.1
    <div class="menu-container" id="menuBtn">
        ☰
        <div class="menu-content" id="menuContent">
            <div class="menu-group-label">New Game</div>
            <div class="menu-item" onclick="createSudokuByDifficulty(45, 'Beginner')">Beginner</div>
            <div class="menu-item" onclick="createSudokuByDifficulty(25, 'Advanced')">Advanced</div>
            
            <div class="menu-group-label">Tools</div>
            <div class="menu-item" style="display:flex; justify-content: space-between;">
                Show Notes 
                <label class="switch">
                    <input type="checkbox" id="notesToggle" onchange="updateUI()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="menu-item" onclick="giveHint()">Give a Hint</div>
            <div class="menu-item" onclick="solveSudoku()">Solve Puzzle</div>
            <div class="menu-item" onclick="clearNotes()" style="color: #cc0000;">Clear Notes</div>
        </div>
    </div>
</div>

<div id="grid" class="sudoku-grid"></div>
<div id="toast"></div>

<script>
    let currentBoard = Array.from({ length: 9 }, () => Array(9).fill(0));
    let hintMask = Array.from({ length: 9 }, () => Array(9).fill(false));
    let notesBoard = Array.from({ length: 9 }, () => Array.from({ length: 9 }, () => Array(9).fill(false)));
    let lastFocused = null;

    const gridEl = document.getElementById('grid');

    function initUI() {
        gridEl.innerHTML = '';
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const container = document.createElement('div');
                container.className = 'cell-container';
                container.id = `cell-${r}-${c}`;

                // Create 3x3 Notes Grid
                const notesGrid = document.createElement('div');
                notesGrid.className = 'notes-grid-mini';
                for (let i = 1; i <= 9; i++) {
                    const n = document.createElement('div');
                    n.className = 'note-digit';
                    n.innerText = i;
                    n.id = `note-${r}-${c}-${i}`;
                    notesGrid.appendChild(n);
                }

                const input = document.createElement('input');
                input.type = 'text';
                input.inputMode = 'numeric';
                input.maxLength = 1;
                input.className = 'cell-input';
                input.oninput = (e) => handleInput(e, r, c);
                input.onfocus = () => { lastFocused = {r, c}; };

                container.appendChild(notesGrid);
                container.appendChild(input);
                gridEl.appendChild(container);
            }
        }
        createSudokuByDifficulty(45, 'Beginner');
    }

    function handleInput(e, r, c) {
        if (hintMask[r][c]) { e.target.value = currentBoard[r][c]; return; }
        
        const val = parseInt(e.target.value);
        if (isNaN(val) || val < 1 || val > 9) {
            currentBoard[r][c] = 0;
            e.target.value = '';
        } else {
            currentBoard[r][c] = val;
            updateNotesAfterPlacement(r, c, val);
        }
        updateUI();
    }

    function updateUI() {
        const showNotes = document.getElementById('notesToggle').checked;
        
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const container = document.getElementById(`cell-${r}-${c}`);
                const input = container.querySelector('.cell-input');
                const val = currentBoard[r][c];

                input.value = val === 0 ? '' : val;
                
                // Toggle Hint Class
                container.className = 'cell-container' + (hintMask[r][c] ? ' hint-cell' : '');

                // Toggle Note Visibility
                for (let i = 1; i <= 9; i++) {
                    const noteEl = document.getElementById(`note-${r}-${c}-${i}`);
                    const shouldShow = showNotes && val === 0 && notesBoard[r][c][i-1];
                    noteEl.className = 'note-digit' + (shouldShow ? ' visible' : '');
                }
            }
        }
    }

    function updateNotesAfterPlacement(r, c, val) {
        // Clear all notes in current cell
        notesBoard[r][c].fill(false);
        // Clear this value from row, col, and box
        for (let i = 0; i < 9; i++) {
            notesBoard[r][i][val-1] = false;
            notesBoard[i][c][val-1] = false;
        }
        const sr = Math.floor(r/3)*3, sc = Math.floor(c/3)*3;
        for (let i=sr; i<sr+3; i++) for (let j=sc; j<sc+3; j++) notesBoard[i][j][val-1] = false;
    }

    // --- Sudoku Logic (Simplified for brevity) ---
    function isValid(board, r, c, n) {
        for (let i=0; i<9; i++) {
            if (board[r][i] === n || board[i][c] === n) return false;
            if (board[3*Math.floor(r/3)+Math.floor(i/3)][3*Math.floor(c/3)+i%3] === n) return false;
        }
        return true;
    }

    function createSudokuByDifficulty(clues) {
        // Reset
        currentBoard = Array.from({length:9},()=>Array(9).fill(0));
        hintMask = Array.from({length:9},()=>Array(9).fill(false));
        
        // Basic Fill (Random)
        for(let i=0; i<clues; i++){
            let r = Math.floor(Math.random()*9), c = Math.floor(Math.random()*9), n = Math.floor(Math.random()*9)+1;
            if(currentBoard[r][c] === 0 && isValid(currentBoard, r, c, n)) {
                currentBoard[r][c] = n;
                hintMask[r][c] = true;
            } else { i--; }
        }
        
        // Auto-generate smart notes for empty cells
        generateSmartNotes();
        updateUI();
    }

    function generateSmartNotes() {
        for(let r=0; r<9; r++){
            for(let c=0; c<9; c++){
                if(currentBoard[r][c] === 0) {
                    for(let n=1; n<=9; n++) if(isValid(currentBoard, r, c, n)) notesBoard[r][c][n-1] = true;
                }
            }
        }
    }

    function clearNotes() {
        notesBoard = Array.from({ length: 9 }, () => Array.from({ length: 9 }, () => Array(9).fill(false)));
        updateUI();
    }

    function toast(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }

    // Menu Toggle
    document.getElementById('menuBtn').onclick = (e) => {
        e.stopPropagation();
        document.getElementById('menuContent').classList.toggle('show');
    };
    window.onclick = () => document.getElementById('menuContent').classList.remove('show');

    initUI();
</script>
</body>
</html>
